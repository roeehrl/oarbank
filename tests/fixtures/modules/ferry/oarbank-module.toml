# ferry: the core test suite's fixture module for folder grants (not shipped). Its runner reads a file from an
# operator-approved read-only folder, writes one into a write-only outbox, and reports what the sandbox refused.
manifest = 1

[module]
id = "dev.codonic.oarbank.ferry"
version = "1.0.0"
compat = "ferry1"
publisher = "oarbank"
license = "Apache-2.0"
codeowners = ["roeehrl"]
stability = "experimental"
description = "Core test fixture: a read-only input folder and a write-only outbox"

[requires]
core = ">=2.5,<3"
module_protocol = [1]
runner_protocol = [1]
platforms = ["darwin-arm64", "darwin-amd64", "linux-arm64", "linux-amd64", "windows-arm64", "windows-amd64"]

[coordinator]
exec = ["python", "-I", "{bundle}/ferry_module.py"]
runtime = { kind = "python" }
capabilities = ["op.apply"]

[runner]
exec = ["python", "-I", "{bundle}/ferry_runner.py"]
runtime = { kind = "python" }
capabilities = ["deterministic_output"]

[[stages]]
name = "eval"
timeout_s = 600
requires = { resources = { cpu = 1, mem_gb = 0.25 } }

[sandbox]
folders = [{ id = "inbox", access = "read" }, { id = "outbox", access = "write" }]

[results]
schema = "schemas/result.schema.json"
schema_version = 1
determinism = "exact"
digest = { version = 1, over = ["digest"] }
fields = [{ name = "digest", type = "string" }]

[[operations]]
verb = "carry"
title = "Carry the inbox file"
tier = "T1"
target = "none"
effects = ["campaigns.create", "jobs.enqueue"]
