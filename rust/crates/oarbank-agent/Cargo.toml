[package]
name = "oarbank-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex.workspace = true
libc = "0.2.190"
oarbank-core = { path = "../oarbank-core" }
oarbank-protection = { path = "../oarbank-protection" }
rand = "0.10.3"
rcgen = "0.14.10"
# host tools: an executable definition's version regex (tools.rs); the coordinator refuses look-around and back-references
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tar = "0.4.46"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"

[dev-dependencies]
# signing test images in imageset.rs's local registry tests
ring = "0.17.14"
# tests' scratch directories: a fresh name each, removed when dropped
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_SystemServices", "Win32_NetworkManagement_Dns", "Win32_System_RemoteDesktop", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_System_StationsAndDesktops", "Win32_System_Time", "Win32_System_Com", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
enumflags2 = "0.7"
landlock = "0.4.7"
seccompiler = "0.5.0"
