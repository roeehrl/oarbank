[package]
name = "oarbank-core"
description = "Shared rules of Oarbank: canonical JSON, job keys, portable paths, platform tokens, bundle digests, sandbox policy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
# float_roundtrip: correctly rounded float parsing, so canonical JSON sees the same doubles as Python
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
# shortest round-trip digits with ties to even, as ECMAScript and Python's repr (std's `{:e}` rounds ties up)
zmij = "1"
