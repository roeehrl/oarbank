[package]
name = "oarbank-protection"
description = "Host protection: owner rules, the memory guard, the dynamic controller, the spawn registry and the capacity engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# argv_regex and log_regex: lookaround and backreferences like Python's `re`, which the console's preview uses
fancy-regex = "0.19"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Performance",
                                               "Win32_System_RemoteDesktop", "Win32_System_SystemInformation",
                                               "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.dev-dependencies]
# the SDK's SYSTEM_PROCESS_INFORMATION, which a test holds the parser's offsets to
windows-sys = { version = "0.61.2", features = ["Win32_System_WindowsProgramming"] }
