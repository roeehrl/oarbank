# Windows binaries link the C runtime statically: a clean Windows machine has no VCRUNTIME140.dll, and the agent and
# launcher must start before anything else is installed (the MSI's setup action runs the launcher).
# The PE files name their debug database by file name only (/PDBALTPATH), not by its path in this build's target
# directory.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/PDBALTPATH:%_PDB%"]
