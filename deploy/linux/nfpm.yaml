# The Linux agent package (docs/design/architecture.md, "Packaging and CI"): deb and rpm from one description. scripts/package-linux.sh
# fills ARCH, VERSION, the binaries' directory, the runtime's and the checkout (REPO).
#
# It installs; joining is `oarbank-node join`'s (docs/design/node-enrollment.md): the postinstall installs the waiting
# service, and stages a code only when the package variables (OARBANK_JOIN_CODE, ...) give one. No desktop libraries:
# a headless node pulls none, and there the desktop entry is a harmless file. The join window runs on the bundled
# runtime and opens the default browser.
name: oarbank-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Codonic <support@codonic.dev>
description: |
  Oarbank node agent: runs jobs from your Oarbank coordinator on this machine, confined (Landlock and seccomp),
  and keeps the machine's own work protected.
vendor: Codonic
homepage: https://codonic.dev
license: Proprietary
contents:
  - src: ${BIN_DIR}/oarbank-agent
    dst: /usr/lib/oarbank/oarbank-agent
    file_info: {mode: 0755}
  - src: ${BIN_DIR}/oarbank-launcher
    dst: /usr/lib/oarbank/oarbank-launcher
    file_info: {mode: 0755}
  - src: /usr/lib/oarbank/oarbank-launcher
    dst: /usr/bin/oarbank-launcher
    type: symlink
  # the node's command line (join, check, status, leave, doctor): the launcher under its second name
  - src: /usr/lib/oarbank/oarbank-launcher
    dst: /usr/bin/oarbank-node
    type: symlink
  # the node runtime: CPython 3.12 with the module SDK, and uv (scripts/build-node-runtime.sh)
  - src: ${RUNTIME_DIR}/
    dst: /usr/lib/oarbank/runtime
    type: tree
  # the join window (deploy/node/), and the desktop entry that opens it and handles oarbank:// links
  - src: ${REPO}/deploy/node/join-window.py
    dst: /usr/lib/oarbank/join/join-window.py
    file_info: {mode: 0644}
  - src: ${REPO}/deploy/node/join-window.html
    dst: /usr/lib/oarbank/join/join-window.html
    file_info: {mode: 0644}
  - src: ./node-desktop.desktop
    dst: /usr/share/applications/dev.codonic.oarbank.node.desktop
    file_info: {mode: 0644}
  # the official artwork, as the coordinator's package installs it (coordinator-nfpm.yaml)
  - src: ${REPO}/docs/assets/logo.svg
    dst: /usr/share/icons/hicolor/scalable/apps/oarbank-node.svg
    file_info: {mode: 0644}
  # an administrator's managed policy goes here (policy.json, node-enrollment.md "Managed policy keys")
  - dst: /etc/oarbank
    type: dir
    file_info: {mode: 0755}
scripts:
  postinstall: ./postinstall.sh
  preremove: ./preremove.sh
  postremove: ./postremove.sh
recommends:
  - podman
