# Paths are rendered as JSON strings by coordinator-stage.py (also valid YAML).
name: oarbank-coordinator
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Codonic <support@codonic.dev>
description: |
  Oarbank coordinator and browser setup wizard.
  The coordinator runs as system services under its own oarbankd account, from boot.
  Launch Oarbank Coordinator to set it up.
vendor: Codonic
homepage: https://codonic.dev
license: Proprietary
depends:
  - systemd
  - python3
  - python3-gi
  - gir1.2-gtk-3.0
overrides:
  rpm:
    depends:
      - systemd
      - python3
      - python3-gobject
      - gtk3
contents:
  - src: ${ROOT}
    dst: /opt/oarbank/coordinator
    type: tree
  # The operator CLI and the setup helper on the PATH; both launchers follow the link back to the payload.
  - src: /opt/oarbank/coordinator/bin/oarbank
    dst: /usr/bin/oarbank
    type: symlink
  - src: /opt/oarbank/coordinator/bin/oarbank-setup
    dst: /usr/bin/oarbank-setup
    type: symlink
  - src: ${DESKTOP}
    dst: /usr/share/applications/dev.codonic.oarbank.coordinator.desktop
    file_info: {mode: 0644}
  - src: ${ICON}
    dst: /usr/share/icons/hicolor/scalable/apps/oarbank-coordinator.svg
    file_info: {mode: 0644}
  - src: ${TRAY}
    dst: /usr/lib/oarbank/coordinator-tray.py
    file_info: {mode: 0755}
  - src: ${AUTOSTART}
    dst: /usr/lib/oarbank/coordinator-autostart.py
    file_info: {mode: 0644}
  - src: /usr/lib/oarbank/coordinator-tray.py
    dst: /usr/bin/oarbank-coordinator
    type: symlink
  - src: ${REMOVE}
    dst: /usr/lib/oarbank/coordinator-remove.py
    file_info: {mode: 0644}
# Install and upgrade refresh or migrate an existing coordinator, never create a new one (the wizard does); final
# removal stops and removes the services and keeps the coordinator's data.
scripts:
  postinstall: ${POSTINSTALL}
  preremove: ${PREREMOVE}
