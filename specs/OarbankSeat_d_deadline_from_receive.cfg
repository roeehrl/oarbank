\* Variant (d): the agent's lease ends at receive time + lease_s instead of send time + lease_s. Expected: AtMostOneRunning violated (a delayed grant reply runs past the coordinator's lease + grace).
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    None = None
    L = 3
    G = 1
    MaxFence = 3
    MaxMsgs = 2
    MaxFaults <- Unbounded
    PatientHeartbeat = FALSE
    TimelyNetwork = FALSE
    ReleaseIfUnassigned = FALSE
    FencePerRun = FALSE
    AgentDownPastLease = FALSE
    NoFenceOnRelease = FALSE
    RenewAfterExpiry = FALSE
    NoGraceOrExpiry = FALSE
    DeadlineFromReceive = TRUE
    AdoptWithoutLeaseCheck = FALSE
    ClockStopsInSleep = FALSE
SYMMETRY NodeSymmetry
CONSTRAINT SeatConstraint
INVARIANTS TypeOK AtMostOneRunning
