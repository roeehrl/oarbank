\* Vacuity check: W_RestartCleanup is expected to be VIOLATED (after a crash the start-up cleanup deletes a journaled mapping).
SPECIFICATION Spec
CONSTANTS
    NumListeners = 1
    Policy = "next_free"
    PermanentOnly = FALSE
    RouterLists = TRUE
    DeleteNeedsSameClient = FALSE
    AgentMayDie = FALSE
    FaultKinds = {"crash"}
    MaxFaults = 1
    MaxForeign = 0
    Lease = 3
    VerifyInterval = 1
    WriteAhead = TRUE
    ReadBackDelete = TRUE
    EpochCheck = TRUE
    ReleaseBeforeRemap = TRUE
    AtomicReadBack = TRUE
    EpochRemapKeepsEntry = TRUE
INVARIANTS W_RestartCleanup
