\* Weakened (f): a ring bakes and widens the rollout with none of its nodes updated (the canary offline). Expected: inv:WidenOnlyOnEvidence
SPECIFICATION Spec
CONSTANTS
    Canary = {n1}
    Broad = {n2, n3}
    CanaryCap = 1
    BroadCap = 1
    CanaryBudget = 0
    BroadBudget = 1
    MaxFaults = 2
    MaxOps = 1
    AutoRollback = TRUE
    NoCap = FALSE
    NoBake = FALSE
    CoordLast = FALSE
    NoHalt = FALSE
    NoJournal = FALSE
    NoEvidence = TRUE
SYMMETRY BroadSymmetry
INVARIANTS TypeOK WidenOnlyOnEvidence
