\* Weakened (c): the nodes update before the coordinator, which updates whenever. Expected: inv:NoNodeAheadOfCoordinator
SPECIFICATION Spec
CONSTANTS
    Canary = {n1}
    Broad = {n2, n3}
    CanaryCap = 1
    BroadCap = 1
    CanaryBudget = 0
    BroadBudget = 1
    MaxFaults = 2
    MaxOps = 1
    AutoRollback = TRUE
    NoCap = FALSE
    NoBake = FALSE
    CoordLast = TRUE
    NoHalt = FALSE
    NoJournal = FALSE
    NoEvidence = FALSE
SYMMETRY BroadSymmetry
INVARIANTS TypeOK NoNodeAheadOfCoordinator
