\* Variant (m) = finding F5, pre-bb04f9d: a certifying node counts as eligible forever; with stalled golden jobs a replica only it could run is never cancelled. Expected: temporal property violated. (No user operations, to keep liveness checking fast.)
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    FaultyNodes = {n2}
    FaultyAlwaysWrong = FALSE
    EvalJobs = {j1}
    ReplicaJobs = {r1}
    ReplicaTarget = j1
    NoJob = NoJob
    NoNode = NoNode
    MaxAtt = 6
    MaxFaults = 2
    MaxUserOps = 0
    MaxExecFailures = 3
    Variant = "none"
    ClaimReadsNodeInTx = TRUE
    DisputeFencesParties = TRUE
    DisputeBumpsGen = TRUE
    SettledJobFence = TRUE
    SelfInconsistencyConvicts = TRUE
    ReplicaNeedsEligible = TRUE
    ReapCancelsReplica = TRUE
    CompleteFencesQuarantine = TRUE
    BreakerFencesAttempts = TRUE
    StrictFailedHere = FALSE
    CertifyingIsEligible = TRUE
    CertifyingGrace = FALSE
    GoldenFailLimit = TRUE
    CertifyMayStall = TRUE
    GoldenFailNodes = {}
    ModuleFaults = FALSE
    AwaitHoldsLease = TRUE
INVARIANTS TypeOK OneCanonical CanonicalGenCurrent StaleNeverCanonical NoLostJob QuarantinedNoGrant DoneHasCanonical LiveOnReadyCertified NoCanonicalFromQuarantined NoCanonicalFromUncertified NoHonestConviction ConvictedResultsInvalidated SettledNotRevived GoldenSetsBounded GoldenFailuresBounded
PROPERTIES Liveness
