\* Variant (m) for disputes: on 3 nodes a stalled certifying third node keeps a 2-party dispute from being declared stranded. Expected: temporal property violated. (No user operations, to keep liveness checking fast.)
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2, n3}
    FaultyNodes = {n3}
    FaultyAlwaysWrong = FALSE
    EvalJobs = {j1}
    ReplicaJobs = {}
    ReplicaTarget = NoJob
    NoJob = NoJob
    NoNode = NoNode
    MaxAtt = 4
    MaxFaults = 2
    MaxUserOps = 0
    MaxExecFailures = 3
    Variant = "none"
    ClaimReadsNodeInTx = TRUE
    DisputeFencesParties = TRUE
    DisputeBumpsGen = TRUE
    SettledJobFence = TRUE
    SelfInconsistencyConvicts = TRUE
    ReplicaNeedsEligible = TRUE
    ReapCancelsReplica = TRUE
    CompleteFencesQuarantine = TRUE
    BreakerFencesAttempts = TRUE
    StrictFailedHere = FALSE
    CertifyingIsEligible = TRUE
    CertifyingGrace = FALSE
    GoldenFailLimit = TRUE
    CertifyMayStall = TRUE
    GoldenFailNodes = {}
    ModuleFaults = FALSE
    AwaitHoldsLease = TRUE
INVARIANTS TypeOK
PROPERTIES Liveness
