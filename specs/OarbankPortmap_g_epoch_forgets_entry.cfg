\* Finding (g): an epoch reset drops the journal entry and the listener maps afresh from its first port. Expected: AtMostOneExternalPortPerListener violated.
SPECIFICATION Spec
CONSTANTS
    NumListeners = 1
    Policy = "next_free"
    PermanentOnly = FALSE
    RouterLists = TRUE
    DeleteNeedsSameClient = FALSE
    AgentMayDie = FALSE
    FaultKinds = {"crash", "reboot"}
    MaxFaults = 2
    MaxForeign = 1
    Lease = 3
    VerifyInterval = 1
    WriteAhead = TRUE
    ReadBackDelete = TRUE
    EpochCheck = TRUE
    ReleaseBeforeRemap = TRUE
    AtomicReadBack = TRUE
    EpochRemapKeepsEntry = FALSE
INVARIANTS TypeOK NoForeignDelete AnnouncedImpliesMapped AtMostOneExternalPortPerListener
