\* Variant (b): the agent also applies a late reply to a request it gave up on, after its lease lapsed and it reported the stop. Expected: AtMostOneRunning violated (the old renewal restarts it under the old fence after the seat moved).
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    None = None
    L = 3
    G = 1
    MaxFence = 3
    MaxMsgs = 2
    MaxFaults <- Unbounded
    PatientHeartbeat = FALSE
    TimelyNetwork = FALSE
    ReleaseIfUnassigned = FALSE
    FencePerRun = FALSE
    AgentDownPastLease = FALSE
    NoFenceOnRelease = FALSE
    RenewAfterExpiry = TRUE
    NoGraceOrExpiry = FALSE
    DeadlineFromReceive = FALSE
    AdoptWithoutLeaseCheck = FALSE
    ClockStopsInSleep = FALSE
SYMMETRY NodeSymmetry
CONSTRAINT SeatConstraint
INVARIANTS TypeOK AtMostOneRunning
