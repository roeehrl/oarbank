\* Variant (f): the agent keeps the lease on a monotonic clock that stops while the machine sleeps. Expected: AtMostOneRunning violated (after a long sleep it resumes under a lease that ended).
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    None = None
    L = 3
    G = 1
    MaxFence = 3
    MaxMsgs = 2
    MaxFaults <- Unbounded
    PatientHeartbeat = FALSE
    TimelyNetwork = FALSE
    ReleaseIfUnassigned = FALSE
    FencePerRun = FALSE
    AgentDownPastLease = FALSE
    NoFenceOnRelease = FALSE
    RenewAfterExpiry = FALSE
    NoGraceOrExpiry = FALSE
    DeadlineFromReceive = FALSE
    AdoptWithoutLeaseCheck = FALSE
    ClockStopsInSleep = TRUE
SYMMETRY NodeSymmetry
CONSTRAINT SeatConstraint
INVARIANTS TypeOK AtMostOneRunning
