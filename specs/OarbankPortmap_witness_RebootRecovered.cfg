\* Vacuity check: W_RebootRecovered is expected to be VIOLATED (a reboot is noticed and the listener re-mapped).
SPECIFICATION Spec
CONSTANTS
    NumListeners = 1
    Policy = "next_free"
    PermanentOnly = FALSE
    RouterLists = TRUE
    DeleteNeedsSameClient = FALSE
    AgentMayDie = FALSE
    FaultKinds = {"reboot"}
    MaxFaults = 1
    MaxForeign = 0
    Lease = 3
    VerifyInterval = 1
    WriteAhead = TRUE
    ReadBackDelete = TRUE
    EpochCheck = TRUE
    ReleaseBeforeRemap = TRUE
    AtomicReadBack = TRUE
    EpochRemapKeepsEntry = TRUE
INVARIANTS W_RebootRecovered
