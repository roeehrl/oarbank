\* Weakened (d): failures above the budget do not halt. Expected: inv:BudgetHalts
SPECIFICATION Spec
CONSTANTS
    Canary = {n1}
    Broad = {n2, n3}
    CanaryCap = 1
    BroadCap = 1
    CanaryBudget = 0
    BroadBudget = 1
    MaxFaults = 2
    MaxOps = 1
    AutoRollback = TRUE
    NoCap = FALSE
    NoBake = FALSE
    CoordLast = FALSE
    NoHalt = TRUE
    NoJournal = FALSE
SYMMETRY BroadSymmetry
INVARIANTS TypeOK BudgetHalts
