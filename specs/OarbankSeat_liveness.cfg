\* Seat leases as designed: liveness once the owner's assignments settle (EventuallyRuns, SeatReGranted) plus safety; 2 nodes, at most 2 faults, patient heartbeats, round trips shorter than the lease. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    None = None
    L = 3
    G = 1
    MaxFence = 3
    MaxMsgs = 2
    MaxFaults = 2
    PatientHeartbeat = TRUE
    TimelyNetwork = TRUE
    ReleaseIfUnassigned = FALSE
    FencePerRun = FALSE
    AgentDownPastLease = FALSE
    NoFenceOnRelease = FALSE
    RenewAfterExpiry = FALSE
    NoGraceOrExpiry = FALSE
    DeadlineFromReceive = FALSE
    AdoptWithoutLeaseCheck = FALSE
    ClockStopsInSleep = FALSE
CONSTRAINT SeatConstraint
INVARIANTS TypeOK AtMostOneRunning RunningHasLease
PROPERTIES EventuallyRunsOnceSettled SeatReGrantedOnceSettled FenceMonotonic
