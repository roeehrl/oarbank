\* Vacuity check: W_SeatMovedAfterExpiry is expected to be VIOLATED (the seat moves to another node after the old holder's lease and grace ran out, and the new node runs it).
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    None = None
    L = 3
    G = 1
    MaxFence = 3
    MaxMsgs = 2
    MaxFaults <- Unbounded
    PatientHeartbeat = FALSE
    TimelyNetwork = FALSE
    ReleaseIfUnassigned = FALSE
    FencePerRun = FALSE
    AgentDownPastLease = FALSE
    NoFenceOnRelease = FALSE
    RenewAfterExpiry = FALSE
    NoGraceOrExpiry = FALSE
    DeadlineFromReceive = FALSE
    AdoptWithoutLeaseCheck = FALSE
    ClockStopsInSleep = FALSE
SYMMETRY NodeSymmetry
CONSTRAINT SeatConstraint
INVARIANTS W_SeatMovedAfterExpiry
