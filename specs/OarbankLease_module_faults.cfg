\* Module host outages; a completion waiting on its module holds its lease (core.py _await_module). All safety properties plus ModuleFaultsNotCharged; 2 nodes x 2 eval jobs. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    FaultyNodes = {n2}
    FaultyAlwaysWrong = FALSE
    EvalJobs = {j1, j2}
    ReplicaJobs = {}
    ReplicaTarget = NoJob
    NoJob = NoJob
    NoNode = NoNode
    MaxAtt = 4
    MaxFaults = 2
    MaxUserOps = 1
    MaxExecFailures = 3
    Variant = "none"
    ClaimReadsNodeInTx = TRUE
    DisputeFencesParties = TRUE
    DisputeBumpsGen = TRUE
    SettledJobFence = TRUE
    SelfInconsistencyConvicts = TRUE
    ReplicaNeedsEligible = TRUE
    ReapCancelsReplica = TRUE
    CompleteFencesQuarantine = TRUE
    BreakerFencesAttempts = TRUE
    StrictFailedHere = FALSE
    CertifyingIsEligible = TRUE
    CertifyingGrace = TRUE
    GoldenFailLimit = TRUE
    CertifyMayStall = FALSE
    GoldenFailNodes = {}
    ModuleFaults = TRUE
    AwaitHoldsLease = TRUE
SYMMETRY JobSymmetry
INVARIANTS TypeOK OneCanonical CanonicalGenCurrent StaleNeverCanonical NoLostJob QuarantinedNoGrant DoneHasCanonical LiveOnReadyCertified NoCanonicalFromQuarantined NoCanonicalFromUncertified NoHonestConviction ConvictedResultsInvalidated SettledNotRevived GoldenSetsBounded GoldenFailuresBounded ModuleFaultsNotCharged
