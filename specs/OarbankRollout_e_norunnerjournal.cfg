\* Weakened (e): the runner keeps its step only in memory, so a crash mid-update forgets it. Expected: inv:RunnerSafe
SPECIFICATION Spec
CONSTANTS
    Canary = {n1}
    Broad = {n2, n3}
    CanaryCap = 1
    BroadCap = 1
    CanaryBudget = 0
    BroadBudget = 1
    MaxFaults = 2
    MaxOps = 1
    AutoRollback = TRUE
    NoCap = FALSE
    NoBake = FALSE
    CoordLast = FALSE
    NoHalt = FALSE
    NoJournal = TRUE
SYMMETRY BroadSymmetry
INVARIANTS TypeOK RunnerSafe
