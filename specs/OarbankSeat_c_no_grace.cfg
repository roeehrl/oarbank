\* Variant (c): the coordinator hands the seat to any assigned node that asks, before the holder's lease (+ grace) ends and without a release. Expected: AtMostOneRunning violated.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    None = None
    L = 3
    G = 1
    MaxFence = 3
    MaxMsgs = 2
    MaxFaults <- Unbounded
    PatientHeartbeat = FALSE
    TimelyNetwork = FALSE
    ReleaseIfUnassigned = FALSE
    FencePerRun = FALSE
    AgentDownPastLease = FALSE
    NoFenceOnRelease = FALSE
    RenewAfterExpiry = FALSE
    NoGraceOrExpiry = TRUE
    DeadlineFromReceive = FALSE
    AdoptWithoutLeaseCheck = FALSE
    ClockStopsInSleep = FALSE
SYMMETRY NodeSymmetry
CONSTRAINT SeatConstraint
INVARIANTS TypeOK AtMostOneRunning
