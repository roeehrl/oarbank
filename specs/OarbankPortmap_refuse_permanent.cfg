\* The design as written on a permanent-only router, fallback refuse, 3 faults: all safety properties. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    NumListeners = 1
    Policy = "refuse"
    PermanentOnly = TRUE
    RouterLists = TRUE
    DeleteNeedsSameClient = FALSE
    AgentMayDie = FALSE
    FaultKinds = {"crash", "reboot", "net", "lose"}
    MaxFaults = 3
    MaxForeign = 1
    Lease = 3
    VerifyInterval = 1
    WriteAhead = TRUE
    ReadBackDelete = TRUE
    EpochCheck = TRUE
    ReleaseBeforeRemap = TRUE
    AtomicReadBack = TRUE
    EpochRemapKeepsEntry = TRUE
INVARIANTS TypeOK NoForeignDelete AnnouncedImpliesMapped AtMostOneExternalPortPerListener
