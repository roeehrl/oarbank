\* The design as written on a permanent-only router, the agent always comes back: EventuallyClean plus safety. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    NumListeners = 1
    Policy = "next_free"
    PermanentOnly = TRUE
    RouterLists = TRUE
    DeleteNeedsSameClient = FALSE
    AgentMayDie = FALSE
    FaultKinds = {"crash", "reboot", "net", "lose"}
    MaxFaults = 2
    MaxForeign = 1
    Lease = 3
    VerifyInterval = 1
    WriteAhead = TRUE
    ReadBackDelete = TRUE
    EpochCheck = TRUE
    ReleaseBeforeRemap = TRUE
    AtomicReadBack = TRUE
    EpochRemapKeepsEntry = TRUE
INVARIANTS TypeOK NoForeignDelete AnnouncedImpliesMapped AtMostOneExternalPortPerListener
PROPERTIES EventuallyClean
