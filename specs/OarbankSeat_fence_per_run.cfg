\* Alternative fix for F1: the coordinator frees on a stop report from an unassigned holder, and every run gets its own fence (a grant to a node reporting not running raises the fence). Checks AtMostOneRunning only: RunningHasLease fails here, because a stale request (one the agent gave up on) raises the fence under a node that already runs, which then runs under an old fence until its next heartbeat stops and restarts it. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    None = None
    L = 3
    G = 1
    MaxFence = 3
    MaxMsgs = 2
    MaxFaults = 1
    PatientHeartbeat = FALSE
    TimelyNetwork = FALSE
    ReleaseIfUnassigned = TRUE
    FencePerRun = TRUE
    AgentDownPastLease = FALSE
    NoFenceOnRelease = FALSE
    RenewAfterExpiry = FALSE
    NoGraceOrExpiry = FALSE
    DeadlineFromReceive = FALSE
    AdoptWithoutLeaseCheck = FALSE
    ClockStopsInSleep = FALSE
SYMMETRY NodeSymmetry
CONSTRAINT SeatConstraint
INVARIANTS TypeOK AtMostOneRunning
PROPERTIES FenceMonotonic
