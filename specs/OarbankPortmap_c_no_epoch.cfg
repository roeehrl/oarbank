\* Variant (c): verify and renewal ignore the router's epoch. Expected: AnnouncedImpliesMapped violated.
SPECIFICATION Spec
CONSTANTS
    NumListeners = 1
    Policy = "next_free"
    PermanentOnly = FALSE
    RouterLists = TRUE
    DeleteNeedsSameClient = FALSE
    AgentMayDie = FALSE
    FaultKinds = {"reboot"}
    MaxFaults = 1
    MaxForeign = 0
    Lease = 3
    VerifyInterval = 1
    WriteAhead = TRUE
    ReadBackDelete = TRUE
    EpochCheck = FALSE
    ReleaseBeforeRemap = TRUE
    AtomicReadBack = TRUE
    EpochRemapKeepsEntry = TRUE
INVARIANTS TypeOK NoForeignDelete AnnouncedImpliesMapped AtMostOneExternalPortPerListener
