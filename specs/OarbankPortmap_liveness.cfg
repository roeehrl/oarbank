\* The design as written: EventuallyClean plus all safety properties; lease router, the agent may stop forever. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    NumListeners = 1
    Policy = "next_free"
    PermanentOnly = FALSE
    RouterLists = TRUE
    DeleteNeedsSameClient = FALSE
    AgentMayDie = TRUE
    FaultKinds = {"crash", "reboot", "net", "lose"}
    MaxFaults = 2
    MaxForeign = 1
    Lease = 3
    VerifyInterval = 1
    WriteAhead = TRUE
    ReadBackDelete = TRUE
    EpochCheck = TRUE
    ReleaseBeforeRemap = TRUE
    AtomicReadBack = TRUE
    EpochRemapKeepsEntry = TRUE
INVARIANTS TypeOK NoForeignDelete AnnouncedImpliesMapped AtMostOneExternalPortPerListener
PROPERTIES EventuallyClean
