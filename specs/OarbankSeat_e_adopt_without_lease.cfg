\* Variant (e): a new agent adopts a live workload without its lease (and takes the lease from the next directive). Expected: AtMostOneRunning violated (an adopted run outlives the lease the seat moved after).
SPECIFICATION Spec
CONSTANTS
    Nodes = {n1, n2}
    None = None
    L = 3
    G = 1
    MaxFence = 3
    MaxMsgs = 2
    MaxFaults <- Unbounded
    PatientHeartbeat = FALSE
    TimelyNetwork = FALSE
    ReleaseIfUnassigned = FALSE
    FencePerRun = FALSE
    AgentDownPastLease = FALSE
    NoFenceOnRelease = FALSE
    RenewAfterExpiry = FALSE
    NoGraceOrExpiry = FALSE
    DeadlineFromReceive = FALSE
    AdoptWithoutLeaseCheck = TRUE
    ClockStopsInSleep = FALSE
SYMMETRY NodeSymmetry
CONSTRAINT SeatConstraint
INVARIANTS TypeOK AtMostOneRunning
