[project]
name = "oarbank"
version = "2.8.0"
description = "Batch orchestrator for a fleet of machines on a tailnet: the coordinator (oarbankd), its console and the admin CLI (oarbank)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "oarbank-sdk",
    "cryptography>=43",      # the agent CA (D29), audit digests (D13), release and owner signing (D31)
    "webauthn>=2.2",
    "segno>=1.6.6",          # local authenticator QR generation; no external service
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.168.3", "pytest-xdist>=3.8", "pillow>=11", "zxing-cpp>=2.3"]      # xdist: CI splits the suite over a runner's cores

[project.scripts]
oarbankd = "oarbank.coordinator.__main__:main"
oarbank = "oarbank.cli.main:main"
oarbank-setup = "oarbank.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oarbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chaos: process-level fault injection against real oarbankd processes (nightly: pytest -m chaos)"]
addopts = "-m 'not chaos'"

[tool.uv.sources]
# the open contracts (Apache-2.0), pinned as a git submodule; the core consumes them, never the other way round
oarbank-sdk = { path = "vendor/oarbank-sdk", editable = true }
