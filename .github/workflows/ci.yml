# CI for the core (docs/design/architecture.md, "Packaging and CI"). It holds no signing keys: release artifacts are built unsigned and the
# owner signs them. The SDK submodule is the public repository github.com/roeehrl/oarbank-sdk.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # the package jobs on a branch before it is tagged (gh workflow run ci.yml --ref <branch>): they build what a tag
  # would, with the repository's own version
  workflow_dispatch:
    inputs:
      coordinator_installers_only:
        description: 'Validate coordinator setup and all native packages; reuse already-passed core/agent checks'
        type: boolean
        default: false
      installer_check_platform:
        description: 'Focused installer recovery only: retain passed checks on other platforms'
        type: choice
        options: [all, windows-11-arm, windows-msi]
        default: all

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}   # empty: the scripts read the repository's

concurrency:
  group: ci-${{ github.ref }}${{ inputs.coordinator_installers_only && '-installers' || '' }}
  cancel-in-progress: true

jobs:
  coordinator:
    if: '!inputs.coordinator_installers_only'
    # the coordinator suite and the chaos tests on every OS the coordinator runs on (docs/design/windows-coordinator.md);
    # on Windows module processes run in the agent's AppContainers, so the agent (and the elevated helper the MSI
    # installs, for enforced allowlists) are built first; xdist splits the suite over the runner's cores
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: x64 CPython on both Windows architectures (cryptography publishes no Windows on Arm wheels), copied files
        if: runner.os == 'Windows'
        run: |
          Add-Content $env:GITHUB_ENV "UV_PYTHON=cpython-3.12-windows-x86_64-none"
          # copies, not hard links into uv's cache (whose files keep a protected DACL the module sandbox's grants never
          # reach); x64 runners copy anyway, their workspace being on another volume than the cache's
          Add-Content $env:GITHUB_ENV "UV_LINK_MODE=copy"
        shell: pwsh
      - name: clang for ring (Windows on Arm)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: scripts/windows-clang.ps1 -Install | Add-Content $env:GITHUB_PATH
        shell: pwsh
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows'
        with:
          workspaces: rust
      - name: the agent's module launcher and the elevated helper (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --locked -p oarbank-agent -p oarbank-launcher
          ../scripts/ci-windows-helper.ps1
        working-directory: rust
        shell: pwsh
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -q -p no:cacheprovider --ignore=tests/rust -n auto
      - run: uv run pytest -q -p no:cacheprovider --ignore=tests/rust -m chaos

  agent:
    if: '!inputs.coordinator_installers_only'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # the coordinator the end-to-end tests start runs on uv's standalone CPython, as a coordinator build does: the
      # runner's python.org interpreter runs as an app, whose local network requests macOS holds for a person to allow
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: uv sync --extra dev --frozen
      - run: cargo test --workspace --locked
        working-directory: rust
      - run: uv run pytest -q -p no:cacheprovider tests/rust
      - name: oarbank-core against the SDK (rust/crates/oarbank-core-py/tests/test_parity.py)
        # the oarbank_core extension, built from the crates cargo test just compiled, into the synced environment
        # (which has the SDK); runs last, as the environment then holds a package the lock file does not
        run: |
          uvx maturin@1.15.0 build --locked -i .venv/bin/python -m rust/crates/oarbank-core-py/Cargo.toml -o "$RUNNER_TEMP/ocore-wheels"
          uv pip install --python .venv "$RUNNER_TEMP"/ocore-wheels/oarbank_core-*.whl
          uv run --no-sync pytest -q -p no:cacheprovider rust/crates/oarbank-core-py/tests/test_parity.py

  windows-e2e:
    if: '!inputs.coordinator_installers_only'
    # the agent's end-to-end tests against a real oarbankd on Windows, as the macOS agent job runs them
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      UV_PYTHON: cpython-3.12-windows-x86_64-none
      UV_LINK_MODE: copy                # as in the coordinator job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: clang for ring (Windows on Arm)
        if: runner.arch == 'ARM64'
        run: scripts/windows-clang.ps1 -Install | Add-Content $env:GITHUB_PATH
        shell: pwsh
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: the agent, the launcher and the elevated helper
        run: |
          cargo build --locked -p oarbank-agent -p oarbank-launcher
          ../scripts/ci-windows-helper.ps1
        working-directory: rust
        shell: pwsh
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -q -p no:cacheprovider tests/rust

  rust-other-os:
    if: '!inputs.coordinator_installers_only'
    # the agent, launcher and portable crates on Linux and Windows, x64 and arm64: unit tests on the real OS (the
    # core's tests replay the SDK's vectors and schemas, so the submodule is checked out)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: clang for ring (Windows on Arm)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: scripts/windows-clang.ps1 -Install | Add-Content $env:GITHUB_PATH
        shell: pwsh
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - name: the repository's Python with the SDK (the endpoint tests run the SDK's reference service with it)
        run: |
          uv venv .venv
          uv pip install --python .venv ./vendor/oarbank-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --locked --workspace --exclude oarbank-core-py
        if: runner.os == 'Windows'
        working-directory: rust
      - name: cargo test in a delegated cgroup (Linux)
        # the agent's job containers are cgroup leaves where systemd delegated the agent's cgroup: the tests run as a
        # transient service of the runner account's user manager (lingering, so it runs without a login) with
        # Delegate=yes, and OARBANK_TEST_CGROUPS=required fails the container tests instead of skipping them
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 100); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 0.1; done
          cargo test --locked --workspace --exclude oarbank-core-py --no-run
          # cargo stands where the launcher stands in a unit: the agent moves it out of the delegated cgroup with
          # itself (OARBANK_LAUNCHER_PID), so the cgroup holds no process and can give its leaves controllers
          # shellcheck disable=SC2016 # $$ is the inner shell's, which exec makes cargo's
          OARBANK_TEST_CGROUPS=required systemd-run --user --wait --pipe --collect --quiet --same-dir --expand-environment=no \
            -E PATH -E HOME -E CARGO_HOME -E RUSTUP_HOME -E OARBANK_TEST_CGROUPS -p Delegate=yes -- \
            sh -c 'OARBANK_LAUNCHER_PID=$$ exec "$(rustup which cargo)" test --locked --workspace --exclude oarbank-core-py'
      - run: cargo build --locked --release -p oarbank-agent -p oarbank-launcher
        working-directory: rust

  windows-containers:
    if: '!inputs.coordinator_installers_only'
    # the Windows container runtime against a real WSL containers session (docs/design/windows-containers.md): GitHub's
    # x64 Windows runners have nested virtualization and WSL 2 (the arm64 ones have neither); WSL 3.0.1 comes from its
    # release, pinned, and the agent's live tests create their own session
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: WSL 3.0.1, the live tests (a session, a registry in it, signed images through the broker) and the doctor's probe
        shell: pwsh
        run: scripts/verify-windows-containers.ps1 -InstallWsl
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verify-windows-containers
          path: dist/verify-windows-containers.log

  coordinator-installers:
    # An explicit manual recovery lane for installer-only fixes. Default PR/tag
    # CI keeps the complete core, chaos, agent and container coverage above.
    if: inputs.coordinator_installers_only
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.installer_check_platform == 'windows-msi' && fromJSON('["windows-2025","windows-11-arm"]') || inputs.installer_check_platform == 'windows-11-arm' && fromJSON('["windows-11-arm"]') || fromJSON('["macos-26","ubuntu-24.04","ubuntu-24.04-arm","windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - if: runner.os == 'Windows'
        run: |
          Add-Content $env:GITHUB_ENV 'UV_PYTHON=cpython-3.12-windows-x86_64-none'
          Add-Content $env:GITHUB_ENV 'UV_LINK_MODE=copy'
        shell: pwsh
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - if: inputs.installer_check_platform != 'windows-msi'
        run: uv run pytest -q -n auto --durations=10 tests/test_coordinator_setup.py tests/test_coordinator_native_macos.py tests/test_coordinator_native_windows.py tests/test_coordinator_linux_packages.py tests/test_packaging.py tests/test_campaigns.py::test_core_names_no_module_concepts
      - if: inputs.installer_check_platform == 'windows-msi'
        run: uv run pytest -q tests/test_coordinator_native_windows.py -k "msi or start_menu or packager_defaults"

  package:
    # oarbank-agent-<v>-macos-arm64.pkg and -macos-x86_64.pkg, each native throughout (docs/design/architecture.md,
    # "Packaging and CI"): the x86_64 one is built here too, its interpreter and agent run under Rosetta 2 for the
    # build's checks; and the coordinator build for darwin-arm64
    if: >-
      always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      ((inputs.coordinator_installers_only && inputs.installer_check_platform != 'windows-msi' && needs.coordinator-installers.result == 'success') ||
      (!inputs.coordinator_installers_only && needs.coordinator.result == 'success' && needs.agent.result == 'success'))
    needs: [coordinator, agent, coordinator-installers]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Rosetta 2, which runs the x86_64 package's code for its checks
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: uv sync --extra dev --frozen
      - run: for arch in arm64 x86_64; do scripts/package-macos.sh "${VERSION#v}" "$arch"; done
      - run: scripts/build-coordinator.sh "${VERSION#v}"
      - run: scripts/package-coordinator-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oarbank-${{ env.VERSION || github.sha }}-macos-unsigned
          path: dist/

  package-linux:
    # deb, rpm, the tarball and the coordinator build for the runner's architecture (amd64, arm64)
    if: >-
      always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      ((inputs.coordinator_installers_only && inputs.installer_check_platform != 'windows-msi' && needs.coordinator-installers.result == 'success') ||
      (!inputs.coordinator_installers_only && needs.rust-other-os.result == 'success' && needs.coordinator.result == 'success'))
    needs: [rust-other-os, coordinator, coordinator-installers]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -q && sudo apt-get install -y -q nfpm
      - run: scripts/package-linux.sh "${VERSION#v}"
      - run: scripts/build-coordinator.sh "${VERSION#v}"
      - run: scripts/package-coordinator-linux.sh
      - run: scripts/ci-coordinator-linux-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oarbank-${{ env.VERSION || github.sha }}-${{ matrix.os }}-unsigned
          path: dist/

  package-windows:
    # oarbank-agent-<v>-windows-x64.msi and -arm64.msi, and the coordinator build for windows-amd64 and windows-arm64:
    # the agent's package for the architecture named, the coordinator build for the runner's
    if: >-
      always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      ((inputs.coordinator_installers_only && needs.coordinator-installers.result == 'success') ||
      (!inputs.coordinator_installers_only && needs.rust-other-os.result == 'success' && needs.coordinator.result == 'success'))
    needs: [rust-other-os, coordinator, coordinator-installers]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: x64, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, arch: arm64, target: aarch64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - name: clang for ring (Windows on Arm)
        if: runner.arch == 'ARM64'
        run: scripts/windows-clang.ps1 -Install | Add-Content $env:GITHUB_PATH
        shell: pwsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: |
          dotnet tool install --global wix --version 5.*
          wix extension add --global WixToolset.Util.wixext/5.0.2
      - run: scripts/package-windows.ps1 -Version "$($env:VERSION.TrimStart('v'))" -Arch ${{ matrix.arch }}
        shell: pwsh
      - run: scripts/build-coordinator.ps1 -Version "$($env:VERSION.TrimStart('v'))"
        shell: pwsh
      - run: scripts/package-coordinator-windows.ps1
        shell: pwsh
      - run: scripts/ci-coordinator-windows-msi.ps1 -Msi "dist/oarbank-coordinator-$((Select-String -Path pyproject.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value)-windows-${{ matrix.arch }}.msi"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinator-msi-logs-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/coordinator-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oarbank-${{ env.VERSION || github.sha }}-windows-${{ matrix.arch }}-unsigned
          path: dist/
