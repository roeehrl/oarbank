# The Windows agent package installed, upgraded and removed for real on a throwaway runner (scripts/ci-windows-msi.ps1):
# both services with their accounts and start types, the elevated helper's loopback openings across a major upgrade,
# and an uninstall that leaves nothing behind. Runs when the package or what it installs changes, and on every tag.
name: msi
on:
  workflow_dispatch:
    inputs:
      coordinator_fixture_only:
        description: 'Diagnose native coordinator MSI lifecycle with a tiny non-executable payload'
        type: boolean
        default: false
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: &paths
      - deploy/windows/**
      - scripts/*windows*
      - scripts/build-node-runtime*
      - scripts/bundle-python*
      - scripts/check-*
      - scripts/fetch-uv.py
      - rust/crates/oarbank-launcher/**
      - rust/.cargo/config.toml
      - .github/workflows/msi.yml
  pull_request:
    paths: *paths

concurrency:
  group: msi-${{ github.ref }}${{ inputs.coordinator_fixture_only && '-coordinator-fixture' || '' }}
  cancel-in-progress: true

jobs:
  msi:
    if: '!inputs.coordinator_fixture_only'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: |
          dotnet tool install --global wix --version 5.*
          wix extension add --global WixToolset.Util.wixext/5.0.2
      - name: two builds of the same tree, the second a patch version later (a major upgrade)
        run: |
          scripts/package-windows.ps1 -Version 2.5.900 -Arch x64
          scripts/package-windows.ps1 -Version 2.5.901 -Arch x64
        shell: pwsh
      - name: install, upgrade, uninstall
        run: scripts/ci-windows-msi.ps1 -First dist/oarbank-agent-2.5.900-windows-x64.msi -Second dist/oarbank-agent-2.5.901-windows-x64.msi -Logs dist/msi-logs
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: msi-logs
          path: dist/msi-logs/

  coordinator-fixture:
    if: inputs.coordinator_fixture_only
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          dotnet tool install --global wix --version 5.*
          wix extension add --global WixToolset.Util.wixext/5.0.2
      - name: stage an inert package fixture (programs are never executed)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'coordinator-fixture'
          New-Item -ItemType Directory -Force "$root/python", "$root/bin", 'dist' | Out-Null
          foreach ($file in @('python/python.exe', 'python/pythonw.exe', 'bin/oarbankd.py', 'bin/oarbank-console.py', 'bin/oarbank-setup.py', 'bin/oarbank-setup.cmd', 'bin/oarbank.cmd', 'bin/oarbank-sandbox.exe', 'bin/uv.exe')) {
            Set-Content -LiteralPath "$root/$file" -Value 'Fixture only; never execute.'
          }
          @{format=1; version='2.6.900'; platform='windows-amd64'; exec=@('python/python.exe','-I','bin/oarbankd.py'); console=@('python/python.exe','-I','bin/oarbank-console.py')} | ConvertTo-Json | Set-Content "$root/oarbank-coordinator.json"
          tar -czf dist/coordinator-fixture.tar.gz -C $root .
          if ($LASTEXITCODE) { throw 'fixture archive failed' }
          scripts/package-coordinator-windows.ps1 -Build dist/coordinator-fixture.tar.gz
      - name: install and remove the inert package, retaining diagnostic logs
        shell: pwsh
        run: |
          $msi = (Resolve-Path dist/oarbank-coordinator-2.6.900-windows-x64.msi).Path
          foreach ($name in @('dev.codonic.oarbank.oarbankd', 'dev.codonic.oarbank.console')) {
            if (Get-Service $name -ErrorAction SilentlyContinue) { throw "unexpected existing service $name" }
          }
          $result = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP/coordinator-fixture-install.log`"" -Wait -PassThru
          if ($result.ExitCode -notin @(0,3010)) {
            Get-Content "$env:RUNNER_TEMP/coordinator-fixture-install.log" | Select-String -Pattern 'Error [0-9]+|Return value 3' -Context 3,3 | Select-Object -Last 35 | ForEach-Object { Write-Host $_ }
            throw "fixture install failed: $($result.ExitCode)"
          }
          $result = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP/coordinator-fixture-uninstall.log`"" -Wait -PassThru
          if ($result.ExitCode -notin @(0,3010)) { throw "fixture uninstall failed: $($result.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinator-fixture-logs-${{ github.sha }}
          path: ${{ runner.temp }}/coordinator-fixture-*.log
